name: Release

# Publishes @seasb/metafab from a pushed tag `v<version>`.
#
# Authentication is npm trusted publishing: the publish job asks GitHub for an
# OIDC token and npm exchanges it for a short-lived publish token, so there is
# no npm token secret here. The trust is configured for this workflow on
# npmjs.com.
#
# The tests run in their own job without the OIDC token. With the token
# available, npm signs provenance for every `npm publish`, including the ones
# the tests send to their local registry, which rejects them.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ">=22.14.0 <23"
      - run: npm ci
      - run: npm run verify

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # request the OIDC token npm authenticates with
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs Node 22.14.0 or later, and `22` on its own
          # does not say so. The range still picks up Node 22 patch releases.
          node-version: ">=22.14.0 <23"
          # Writes the npm registry npm publishes to. No dependency cache: a
          # cache written by another run must not reach the publish step.
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - run: npm install --global npm@^11.5.1
      # No install scripts run in the job that holds the OIDC token.
      - run: npm ci --ignore-scripts
      - name: Check the tag names this version
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not name package.json version $version"
            exit 1
          fi
      - run: npm run build
      # The tag is always written out: npm 11 refuses to publish a prerelease
      # version without `--tag`, and an older npm would move `latest` to it, so
      # `npx @seasb/metafab` would start installing a prerelease. dist-tag.mjs
      # prints `next` for a prerelease and `latest` for every other version.
      - name: Publish under the version's dist-tag
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          tag=$(node .github/scripts/dist-tag.mjs "$version")
          npm publish --tag "$tag"
