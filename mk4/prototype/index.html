<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Metafab Mark IV · fab monitor</title>
<link rel="icon" href="../../assets/favicon.svg" />
<link rel="stylesheet" href="styles.css?v=4100000001" />
<link rel="stylesheet" href="work.css?v=4100000001" />
</head>
<body>

<!-- The desktop is scenery. It is here so the monitor can be judged where it
     lives: under a menu bar icon, beside an editor. -->
<div class="desk" id="desk">

  <header class="menubar">
    <div class="mb-l">
      <span class="mb-apple"></span>
      <b>Cursor</b><span>File</span><span>Edit</span><span>Selection</span><span>View</span><span>Go</span><span>Window</span><span>Help</span>
    </div>
    <div class="mb-r">
      <button class="mb-fab" id="fabIcon" title="fab monitor"></button>
      <span class="mb-sys" id="mbSys"></span>
      <span class="mb-clock" id="clock"></span>
    </div>
  </header>

  <div class="editor" id="editor"></div>

  <!-- the monitor -->
  <section class="panel" id="panel" aria-label="fab monitor">
    <i class="pn-notch"></i>
    <header class="pn-h" id="pnHead"></header>
    <div class="pn-tabs" id="pnTabs"></div>
    <div class="pn-body" id="pnBody"></div>
    <div class="pn-sheet" id="pnSheet"></div>
    <footer class="pn-foot" id="pnFoot"></footer>
  </section>

  <div class="notes" id="notes"></div>
</div>

<div class="toasts" id="toasts"></div>

<script src="data.js?v=4100000001"></script>
<script src="core.js?v=4100000001"></script>
<script src="work.js?v=4100000001"></script>
<script src="sheets.js?v=4100000001"></script>
<script src="artifact.js?v=4100000001"></script>
<script src="events.js?v=4100000001"></script>
<script src="sim.js?v=4100000001"></script>
</body>
</html>
