<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Canvas lab</title>
<style>
:root{
  --bg:#fbfbfd; --card:#fff; --line:rgba(0,0,0,.10); --line-soft:rgba(0,0,0,.06);
  --text:#1c1c1e; --text-2:#6c6c72; --text-3:#9a9aa1;
  --accent:#007aff; --accent-dim:rgba(0,122,255,.12);
  --wire:rgba(0,0,0,.26); --raise:#f2f2f4; --mesh:rgba(0,0,0,.10);
  --amber:#e0a34e; --red:#e5484d;
  --shadow:0 0 0 .5px var(--line), 0 1px 2px rgba(0,0,0,.05), 0 8px 22px -14px rgba(0,0,0,.35);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0d0d0f; --card:#26262a; --line:rgba(255,255,255,.10); --line-soft:rgba(255,255,255,.05);
  --text:#f0f0f2; --text-2:#9a9aa1; --text-3:#6b6b73;
  --accent:#0a84ff; --accent-dim:rgba(10,132,255,.18);
  --wire:rgba(255,255,255,.24); --raise:#2c2c31; --mesh:rgba(255,255,255,.06);
  --shadow:0 0 0 .5px rgba(255,255,255,.06), 0 2px 6px rgba(0,0,0,.5), 0 14px 34px -18px rgba(0,0,0,.9);
}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:13px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;color:var(--text);background:var(--bg);overflow:hidden}

.canvas{position:fixed;inset:0;overflow:hidden;cursor:grab;
  background-image:radial-gradient(var(--mesh) 1px,transparent 1px);
  background-size:24px 24px;background-position:0 0}
.canvas.grab{cursor:grabbing}

.world{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
.edges{position:absolute;top:0;left:0;overflow:visible;pointer-events:none}
.edges path{fill:none}
.wire{stroke:var(--wire);stroke-width:1.8}
.wire.back{stroke:var(--accent);stroke-width:1.6;stroke-dasharray:6 5;opacity:.6}
.wire.in{stroke:var(--accent);stroke-width:1.6;opacity:.5}

/* a node */
.node{position:absolute;background:var(--card);border:.5px solid var(--line);border-radius:12px;
  box-shadow:var(--shadow);cursor:grab;user-select:none;overflow:hidden}
.node.drag{cursor:grabbing;box-shadow:var(--shadow),0 0 0 3px var(--accent-dim);border-color:var(--accent)}
.n-h{display:flex;align-items:center;gap:8px;padding:9px 11px 3px}
.n-h svg{color:var(--text-3);flex:none}
.n-t{font-size:13px;font-weight:640;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.n-n{margin-left:auto;font-size:11px;font-weight:600;color:var(--text-2);background:var(--raise);
  border-radius:20px;padding:1px 7px;font-variant-numeric:tabular-nums;flex:none}
.n-sub{padding:0 11px 10px;color:var(--text-3);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-family:ui-monospace,"SF Mono",Menlo,monospace}

/* an input is not a state but a little runbook: it takes freeform text or polls
   an API and emits feedback items. So it reads as a compact program pill, not a
   list card. Icon in accent to show it runs. */
.node.input{display:flex;align-items:center;gap:7px;padding:6px 8px 6px 11px;border-radius:20px;overflow:visible}
.node.input .n-ico{display:flex;color:var(--accent);flex:none}
.node.input .n-t{font-size:12.5px;font-weight:600}
.node.input .n-n{margin-left:2px}

/* the little in/out ports */
.port{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--card);
  border:1.5px solid var(--wire);top:50%;transform:translateY(-50%)}
.port.out{right:-4px}
.port.in{left:-4px}

/* process label riding an edge */
.elabel{position:absolute;transform:translate(-50%,-50%);background:var(--card);
  border:.5px solid var(--line);border-radius:16px;padding:2px 9px;font-size:11px;font-weight:560;
  color:var(--text-2);white-space:nowrap;box-shadow:0 1px 2px rgba(0,0,0,.05);pointer-events:none}
.elabel b{color:var(--accent);font-weight:600;margin-right:4px}

.tools{position:fixed;left:14px;bottom:14px;display:flex;gap:6px}
.tools button{height:30px;padding:0 12px;border:.5px solid var(--line);background:var(--card);
  border-radius:8px;color:var(--text-2);font:inherit;font-size:12px;cursor:pointer;box-shadow:var(--shadow)}
.tools button:hover{color:var(--text)}
.hint{position:fixed;right:16px;top:14px;color:var(--text-3);font-size:11.5px}
</style>
</head>
<body>
<div class="canvas" id="canvas">
  <div class="world" id="world">
    <svg class="edges" id="edges" width="4000" height="2400"></svg>
  </div>
</div>
<div class="tools">
  <button id="fit">Fit</button>
  <button id="reset">Reset layout</button>
</div>
<div class="hint">drag nodes · drag background to pan · scroll to zoom</div>

<script>
/* ── tiny icon set (16px, stroke) ── */
const I = (p,s=16)=>`<svg width="${s}" height="${s}" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const ICON = {
  flag:  I(`<path d="M3.6 14V2.6M3.6 3.4h7.2l-1.4 2.6 1.4 2.6H3.6"/>`),
  spark: I(`<path d="M8 1.8l1.3 3.6L13 6.7l-3.7 1.3L8 11.6 6.7 8 3 6.7l3.7-1.3z"/>`),
  heat:  I(`<path d="M8 1.9c2.2 2.5 1 3.9.4 4.6-1 1.2-1.4 2-1.4 2.9a2.6 2.6 0 0 0 5.2 0c0-.7-.2-1.2-.5-1.7 1.6 1 2.5 2.5 2.5 4A5.8 5.8 0 0 1 2.4 12c0-3.4 2-5 3.2-6.6C6.7 4 7.8 2.9 8 1.9z"/>`),
  doc:   I(`<path d="M9 2.2H5a1.4 1.4 0 0 0-1.4 1.4v8.8A1.4 1.4 0 0 0 5 13.8h6a1.4 1.4 0 0 0 1.4-1.4V5.6z"/><path d="M9 2.2v3.4h3.4"/>`),
  list:  I(`<rect x="2.3" y="6.5" width="11.4" height="7.2" rx="1.9"/><path d="M3.9 4.5h8.2M5.5 2.5h5"/>`),
  branch:I(`<circle cx="4.4" cy="3.6" r="1.8"/><circle cx="4.4" cy="12.4" r="1.8"/><circle cx="11.6" cy="6.2" r="1.8"/><path d="M4.4 5.4v5.2M6.2 6.2h2.2a1.4 1.4 0 0 1 1.4 1.4v.6a3.4 3.4 0 0 1-3.4 3.4H5.6"/>`),
  pr:    I(`<circle cx="4.4" cy="3.8" r="1.8"/><circle cx="4.4" cy="12.2" r="1.8"/><circle cx="11.6" cy="12.2" r="1.8"/><path d="M4.4 5.6v4.8M11.6 10.4V6.6a2 2 0 0 0-2-2H7.2"/><path d="M8.8 3.1 7.1 4.6l1.7 1.5"/>`),
  check: I(`<circle cx="8" cy="8" r="6.2"/><path d="M5.2 8.2 7.1 10l3.7-4"/>`),
  robot: I(`<rect x="2.6" y="5.4" width="10.8" height="8.2" rx="2.8"/><path d="M8 5.4V3.4"/><circle cx="8" cy="2.4" r="1"/><circle cx="6" cy="9.3" r=".95" fill="currentColor" stroke="none"/><circle cx="10" cy="9.3" r=".95" fill="currentColor" stroke="none"/>`),
};

/* ── the factory, hardcoded. x,y are world coords of each node's top-left.
      The six stations sit on a RECTANGLE and the flow runs clockwise around
      the perimeter. A left feeder of inputs pours into one side, and one branch
      cuts up through the middle, from the bottom edge back to the top. Move
      anything — the wires re-route by picking whichever side faces the target. */
const NODES = [
  // input programs — stacked above the Feedback intake, flowing down into it
  { id:"bugs",   x:270, y:110, kind:"input", icon:"flag",  t:"Bug reports",      sub:"from users", n:12 },
  { id:"feat",   x:270, y:198, kind:"input", icon:"spark", t:"Feature requests", sub:"from users", n:7  },
  { id:"signal", x:270, y:286, kind:"input", icon:"heat",  t:"Usage signals",    sub:"telemetry",  n:34 },

  // a 2×3 grid, rotated so Feedback is the top-left corner. Top row flows
  // left→right, down the right column, bottom row right→left, up the left column.
  { id:"feed",   x:440,  y:430, icon:"flag",  t:"Feedback",     sub:"feedback/*.md",         n:9   }, // r1 c1
  { id:"spec",   x:790,  y:430, icon:"doc",   t:"Product spec", sub:"docs/**/*.md",          n:18  }, // r1 c2
  { id:"plans",  x:1140, y:430, icon:"list",  t:"Build plans",  sub:"slices/*.md · planned", n:41  }, // r1 c3
  { id:"branch", x:1140, y:750, icon:"branch",t:"Worker branch",sub:"git · worktrees/*",     n:6   }, // r2 c3
  { id:"pr",     x:790,  y:750, icon:"pr",    t:"Worker PR",    sub:"gh · pr head:slice/*",  n:3   }, // r2 c2
  { id:"merged", x:440,  y:750, icon:"check", t:"Merged",       sub:"slices/*.md · merged",  n:273 }, // r2 c1
];

const EDGES = [
  // input programs drop down into the top of the Feedback intake
  { from:"bugs",   to:"feed", cls:"in", fromSide:"right", toSide:"top" },
  { from:"feat",   to:"feed", cls:"in", fromSide:"right", toSide:"top" },
  { from:"signal", to:"feed", cls:"in", fromSide:"right", toSide:"top" },

  // clockwise around the rectangle
  { from:"spec",   to:"plans",  label:"plan feature" },     // top edge  →
  { from:"plans",  to:"branch", label:"dispatch" },         // right edge ↓
  { from:"branch", to:"pr",     label:"build + review" },   // right edge ↓
  { from:"pr",     to:"merged", label:"review" },           // bottom     ←
  { from:"merged", to:"feed",   label:"log feedback" },     // left edge  ↑
  { from:"feed",   to:"spec",   label:"triage feedback" },  // left edge  ↑

  // the branch: leaves the bottom of the rectangle and cuts back up to the top
  { from:"pr", to:"spec", label:"hotfix", back:true, fromSide:"top", toSide:"bottom" },
];

/* ── state ── */
const byId = Object.fromEntries(NODES.map(n=>[n.id,n]));
let view = { z:1, px:0, py:0 };
const canvas = document.getElementById("canvas");
const world  = document.getElementById("world");
const svg    = document.getElementById("edges");
const els = {};  // node id -> DOM el

/* build node DOM once */
function buildNodes(){
  NODES.forEach(n=>{
    const el = document.createElement("div");
    el.className = "node" + (n.kind==="input"?" input":"");
    el.dataset.id = n.id;
    el.innerHTML = (n.kind==="input"
      ? `<span class="n-ico">${ICON[n.icon]}</span><span class="n-t">${n.t}</span><span class="n-n">${n.n}</span>`
      : `<div class="n-h">${ICON[n.icon]}<span class="n-t">${n.t}</span><span class="n-n">${n.n}</span></div>`+
        `<div class="n-sub">${n.sub}</div>`)+
      `<i class="port in"></i><i class="port out"></i>`;
    world.appendChild(el);
    els[n.id] = el;
    // measure once laid out
  });
  // position + measure
  NODES.forEach(n=>{ const el=els[n.id]; el.style.left=n.x+"px"; el.style.top=n.y+"px";
    n.w = el.offsetWidth; n.h = el.offsetHeight; });
}

/* a connection point on one of a node's four sides, at fraction f along it,
   with the outward normal used to shape the curve's tangent. */
function port(n, side, f){
  if(side==="right")  return { x:n.x+n.w,     y:n.y+n.h*f, nx: 1, ny: 0 };
  if(side==="left")   return { x:n.x,         y:n.y+n.h*f, nx:-1, ny: 0 };
  if(side==="top")    return { x:n.x+n.w*f,   y:n.y,       nx: 0, ny:-1 };
  return                     { x:n.x+n.w*f,   y:n.y+n.h,   nx: 0, ny: 1 };  // bottom
}

/* pick which side each edge leaves and enters. Overlap-aware:
   - boxes share a row  → straight left↔right
   - boxes share a column → straight top↕bottom
   - diagonal → leave along the dominant axis (biased toward top/bottom) and
     enter the perpendicular facing side, so it reads as a clean L-elbow. */
function pickSides(a, b){
  const overlapX = a.x < b.x+b.w && b.x < a.x+a.w;
  const overlapY = a.y < b.y+b.h && b.y < a.y+a.h;
  const dx=(b.x+b.w/2)-(a.x+a.w/2), dy=(b.y+b.h/2)-(a.y+a.h/2);
  let horiz;
  if(overlapY && !overlapX)      horiz=true;
  else if(overlapX && !overlapY) horiz=false;
  else                           horiz = Math.abs(dx) > Math.abs(dy)*1.35;   // prefer vertical
  if(horiz){
    const from = dx>=0 ? "right" : "left";
    const to   = overlapY ? (dx>=0?"left":"right") : (dy>=0?"top":"bottom");
    return [from, to];
  }
  const from = dy>=0 ? "bottom" : "top";
  const to   = overlapX ? (dy>=0?"top":"bottom") : (dx>=0?"left":"right");
  return [from, to];
}

/* resolve every edge to two ports, spreading edges that share a side. */
function route(){
  EDGES.forEach(e=>{
    const [fs,ts]=pickSides(byId[e.from], byId[e.to]);
    e._fs=e.fromSide||fs; e._ts=e.toSide||ts;
  });
  const out={}, inn={};
  EDGES.forEach(e=>{ (out[e.from+":"+e._fs] ??= []).push(e); (inn[e.to+":"+e._ts] ??= []).push(e); });
  const frac=(list,e)=> (list.indexOf(e)+1)/(list.length+1);
  EDGES.forEach(e=>{
    e._a=port(byId[e.from], e._fs, frac(out[e.from+":"+e._fs], e));
    e._b=port(byId[e.to],   e._ts, frac(inn[e.to+":"+e._ts], e));
  });
}

const R = 16;   // corner radius for the grid routing

/* orthogonal route between the two ports: a stub out of each side, then straight
   H/V segments meeting in the middle — an L when the sides are perpendicular,
   a Z when they face the same axis. */
function orthoPoints(e){
  const a=e._a, b=e._b, stub=24;
  const s0={x:a.x,y:a.y},                 s1={x:a.x+a.nx*stub, y:a.y+a.ny*stub};
  const t1={x:b.x+b.nx*stub, y:b.y+b.ny*stub}, t0={x:b.x,y:b.y};
  const aH=a.ny===0, bH=b.ny===0;         // does each port exit horizontally?
  let mid;
  if(aH && bH)      mid=[{x:(s1.x+t1.x)/2, y:s1.y},{x:(s1.x+t1.x)/2, y:t1.y}];
  else if(!aH&&!bH) mid=[{x:s1.x, y:(s1.y+t1.y)/2},{x:t1.x, y:(s1.y+t1.y)/2}];
  else if(aH&&!bH)  mid=[{x:t1.x, y:s1.y}];
  else              mid=[{x:s1.x, y:t1.y}];
  return [s0,s1,...mid,t1,t0];
}

/* an orthogonal polyline drawn with rounded corners */
function roundedPath(raw, r){
  const p=[]; for(const q of raw){ const l=p[p.length-1]; if(!l||Math.abs(q.x-l.x)>0.5||Math.abs(q.y-l.y)>0.5) p.push(q); }
  if(p.length<2) return {d:"",mid:p[0]||{x:0,y:0}};
  let d=`M${p[0].x},${p[0].y}`;
  for(let i=1;i<p.length-1;i++){
    const a=p[i-1], c=p[i], b=p[i+1];
    const d1=Math.hypot(c.x-a.x,c.y-a.y)||1, d2=Math.hypot(b.x-c.x,b.y-c.y)||1;
    const rr=Math.min(r, d1/2, d2/2);
    const s={x:c.x+(a.x-c.x)/d1*rr, y:c.y+(a.y-c.y)/d1*rr};
    const t={x:c.x+(b.x-c.x)/d2*rr, y:c.y+(b.y-c.y)/d2*rr};
    d+=` L${s.x.toFixed(1)},${s.y.toFixed(1)} Q${c.x},${c.y} ${t.x.toFixed(1)},${t.y.toFixed(1)}`;
  }
  const last=p[p.length-1];
  d+=` L${last.x},${last.y}`;
  // label at the halfway point along the polyline
  let total=0; const segs=[];
  for(let i=1;i<p.length;i++){ const l=Math.hypot(p[i].x-p[i-1].x,p[i].y-p[i-1].y); segs.push(l); total+=l; }
  let want=total/2, mid=p[0];
  for(let i=1;i<p.length;i++){ if(want<=segs[i-1]){ const f=want/(segs[i-1]||1); mid={x:p[i-1].x+(p[i].x-p[i-1].x)*f, y:p[i-1].y+(p[i].y-p[i-1].y)*f}; break; } want-=segs[i-1]; }
  return { d, mid };
}

function edgeD(e){
  const { d, mid } = roundedPath(orthoPoints(e), R);
  return { d, mx:mid.x, my:mid.y };
}

/* redraw all edges + labels */
function drawEdges(){
  route();
  let paths="", labels="";
  EDGES.forEach(e=>{
    const g=edgeD(e);
    const cls = "wire" + (e.back?" back":"") + (e.cls==="in"?" in":"");
    const arrow = e.back? "url(#aBack)" : (e.cls==="in"? "url(#aIn)":"url(#aFwd)");
    paths += `<path class="${cls}" d="${g.d}" marker-end="${arrow}"/>`;
    if(e.label) labels += `<div class="elabel" style="left:${g.mx}px;top:${g.my}px">${e.back?"<b>↑</b>":""}${e.label}</div>`;
  });
  svg.innerHTML =
    `<defs>${mk("aFwd","var(--wire)")}${mk("aIn","var(--accent)",.7)}${mk("aBack","var(--accent)",.7)}</defs>${paths}`;
  document.querySelectorAll(".elabel").forEach(el=>el.remove());
  world.insertAdjacentHTML("beforeend", labels);
}
const mk=(id,c,o=1)=>`<marker id="${id}" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="${c}" opacity="${o}"/></marker>`;

function applyView(){ world.style.transform=`translate(${view.px}px,${view.py}px) scale(${view.z})`; }

/* ── node dragging ── */
let drag=null;
world.addEventListener("mousedown",(e)=>{
  const nd=e.target.closest(".node"); if(!nd) return;
  e.stopPropagation();
  const n=byId[nd.dataset.id];
  drag={ n, el:nd, sx:e.clientX, sy:e.clientY, ox:n.x, oy:n.y };
  nd.classList.add("drag");
});

/* ── pan ── */
let pan=null;
canvas.addEventListener("mousedown",(e)=>{
  if(e.target.closest(".node")) return;
  pan={ sx:e.clientX, sy:e.clientY, px:view.px, py:view.py };
  canvas.classList.add("grab");
});

window.addEventListener("mousemove",(e)=>{
  if(drag){
    drag.n.x=drag.ox+(e.clientX-drag.sx)/view.z;
    drag.n.y=drag.oy+(e.clientY-drag.sy)/view.z;
    drag.el.style.left=drag.n.x+"px"; drag.el.style.top=drag.n.y+"px";
    drawEdges();
  } else if(pan){
    view.px=pan.px+(e.clientX-pan.sx); view.py=pan.py+(e.clientY-pan.sy);
    applyView();
  }
});
window.addEventListener("mouseup",()=>{
  if(drag) drag.el.classList.remove("drag");
  drag=null; pan=null; canvas.classList.remove("grab");
});

/* ── zoom under cursor ── */
canvas.addEventListener("wheel",(e)=>{
  e.preventDefault();
  const r=canvas.getBoundingClientRect(), mx=e.clientX-r.left, my=e.clientY-r.top;
  const k=Math.exp(-e.deltaY*0.0016), z=Math.min(2.4,Math.max(.3,view.z*k)), f=z/view.z;
  view.px=mx-(mx-view.px)*f; view.py=my-(my-view.py)*f; view.z=z;
  applyView();
},{passive:false});

/* ── fit everything into view ── */
function fit(){
  const pad=80;
  const minX=Math.min(...NODES.map(n=>n.x)), minY=Math.min(...NODES.map(n=>n.y));
  const maxX=Math.max(...NODES.map(n=>n.x+n.w)), maxY=Math.max(...NODES.map(n=>n.y+n.h));
  const w=maxX-minX+pad*2, h=maxY-minY+pad*2;
  const z=Math.min(innerWidth/w, innerHeight/h, 1.2);
  view.z=z;
  view.px=(innerWidth - w*z)/2 - (minX-pad)*z;
  view.py=(innerHeight - h*z)/2 - (minY-pad)*z;
  applyView();
}

const HOME = NODES.map(n=>({id:n.id,x:n.x,y:n.y}));
document.getElementById("reset").onclick=()=>{
  HOME.forEach(h=>{ const n=byId[h.id]; n.x=h.x; n.y=h.y; els[h.id].style.left=n.x+"px"; els[h.id].style.top=n.y+"px"; });
  drawEdges(); fit();
};
document.getElementById("fit").onclick=fit;

/* ── boot ── */
buildNodes();
drawEdges();
fit();
</script>
</body>
</html>
