<html lang="en">
<head>

<title>Metafab monitor · menu bar prototype</title>
<style>
:root {
	--sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, system-ui, sans-serif;
	--mono: "SF Mono", ui-monospace, Menlo, "JetBrains Mono", monospace;
	--pop: #161719; --raise: #222327; --raise2: #2a2b30;
	--t1: #ececef; --t2: #8e9097; --t3: #63656c;
	--hair: rgba(255,255,255,.08); --hair2: rgba(255,255,255,.13);
	--acc: #4c8df6; --wait: #d99a3a; --idle: #4a4d55; --done: #5f9e7f;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #15171b;
	font: 13px/1.4 var(--sans); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }

/* ---------- the fake Mac ---------- */
#desk { position: fixed; inset: 0; background: linear-gradient(180deg, #3a4150 0%, #1c1f26 62%, #15171b 100%); }
#menubar { position: absolute; top: 0; left: 0; right: 0; height: 26px; z-index: 30; display: flex; align-items: center; gap: 18px;
	padding: 0 12px 0 16px; color: rgba(255,255,255,.92); font-size: 13px; background: rgba(14,15,18,.5); backdrop-filter: blur(24px) saturate(1.4);
	box-shadow: 0 .5px 0 rgba(255,255,255,.06); user-select: none; }
#menubar b { font-weight: 600; }
#menubar .sp { flex: 1; }
#menubar .sys { opacity: .9; display: flex; align-items: center; }
#mbi { all: unset; display: flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 5px; font-size: 12px; font-weight: 500; font-variant-numeric: tabular-nums; cursor: default; }
#mbi:hover, #mbi.on { background: rgba(255,255,255,.16); }
#mbi svg { display: block; }
#mbd { width: 5px; height: 5px; border-radius: 50%; background: var(--wait); display: none; }
.win { position: absolute; left: 3.5%; top: 58px; width: 57%; height: 76%; border-radius: 10px; overflow: hidden; background: #1b1c20;
	box-shadow: 0 0 0 .5px rgba(255,255,255,.12), 0 0 0 1px rgba(0,0,0,.5), 0 24px 60px rgba(0,0,0,.45); display: grid; grid-template-rows: 32px 1fr; }
.win .tb { display: flex; align-items: center; gap: 12px; padding: 0 12px; background: #202125; color: #8e9097; font-size: 12px; box-shadow: 0 .5px 0 rgba(255,255,255,.06); }
.win .tb .t { flex: 1; text-align: center; margin-right: 52px; }
.lights { display: flex; gap: 8px; } .lights i { width: 12px; height: 12px; border-radius: 50%; }
.win .bd { display: grid; grid-template-columns: 190px 1fr; min-height: 0; }
.tree { background: #1e1f23; padding: 12px 14px; color: #7c7f87; font-size: 12px; line-height: 22px; box-shadow: .5px 0 0 rgba(255,255,255,.05); }
.tree .on { color: #e6e6e9; background: #2a2b30; margin: 0 -14px; padding: 0 14px; }
.code { padding: 14px 0; font: 12px/20px var(--mono); overflow: hidden; }
.code .ln { display: flex; align-items: center; gap: 6px; height: 20px; }
.code .no { width: 40px; text-align: right; color: #45474e; padding-right: 10px; }
.code i { height: 6px; border-radius: 3px; opacity: .42; }
#dock { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; padding: 7px 9px; border-radius: 18px;
	background: rgba(30,32,38,.55); backdrop-filter: blur(20px); box-shadow: inset 0 0 0 .5px rgba(255,255,255,.12), 0 0 0 .5px rgba(0,0,0,.5); }
#dock i { width: 46px; height: 46px; border-radius: 11px; display: grid; place-items: center; background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,0) 60%), #2a2c31;
	box-shadow: inset 0 0 0 .5px rgba(255,255,255,.14), 0 1px 2px rgba(0,0,0,.3); }
#dock svg { width: 24px; height: 24px; opacity: .85; }

/* ---------- the popover ---------- */
#arrow { display: none; }
#pop { position: fixed; top: 32px; left: 0; width: 508px; height: 438px; z-index: 40; overflow: hidden; border-radius: 12px; background: var(--pop); color: var(--t1);
	font: 12px/16px var(--sans); letter-spacing: 0; -webkit-font-smoothing: antialiased;
	box-shadow: 0 0 0 .5px rgba(0,0,0,.85), 0 18px 48px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.3);
	transform-origin: var(--ax, 50%) 0; transition: opacity .14s ease-out, transform .18s cubic-bezier(.2,1,.3,1); }
#pop::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: 10; box-shadow: inset 0 0 0 .5px rgba(255,255,255,.14); }
#pop.hide { opacity: 0; transform: scale(.98) translateY(-3px); pointer-events: none; }

#grip { position: absolute; top: 0; left: 0; right: 0; height: 36px; z-index: 3; display: flex; align-items: center; gap: 8px; padding: 0 17px 0 22px;
	box-shadow: 0 .5px 0 var(--hair); user-select: none; }
#pop.pinned #grip { cursor: grab; }
#grip b { font-weight: 600; font-size: 13px; }
#grip span { color: var(--t2); }
#grip .sp { flex: 1; }
#grip .run { font-variant-numeric: tabular-nums; display: none; align-items: center; gap: 6px; color: var(--t2); margin-right: 6px; }
#grip .run.on { display: flex; }
#grip .run i { width: 6px; height: 6px; border-radius: 50%; background: var(--acc); }
#pin { width: 24px; height: 24px; border: 0; border-radius: 6px; background: transparent; color: var(--t3); display: grid; place-items: center; cursor: default; }
#pin:hover { background: rgba(255,255,255,.06); color: var(--t1); }
#pin.on { color: var(--t1); background: rgba(255,255,255,.08); }

#stage { position: absolute; top: 36px; bottom: 44px; left: 0; right: 0; }
#stage canvas#cv { position: absolute; inset: 0; display: block; cursor: default; touch-action: none; outline: none; }
#stage canvas#cv.pan { cursor: grabbing; }

#tip { position: absolute; z-index: 6; pointer-events: none; padding: 6px 9px 7px; max-width: 250px; display: none; background: var(--raise); border-radius: 7px; color: var(--t1);
	box-shadow: 0 0 0 .5px var(--hair2), 0 8px 24px rgba(0,0,0,.45); font-size: 12px; line-height: 16px; }
#tip .m { color: var(--t2); font-size: 11px; line-height: 15px; margin-top: 2px; }

/* footer: legend, or the selection */
#sel { position: absolute; left: 0; right: 0; bottom: 0; height: 44px; z-index: 4; display: flex; align-items: center; gap: 10px; padding: 0 13px 0 22px;
	box-shadow: 0 -.5px 0 var(--hair); color: var(--t2); }
#sel .lg { display: flex; align-items: center; gap: 16px; }
#sel .lg span { display: flex; align-items: center; gap: 6px; }
#sel .lg b { color: var(--t1); font-weight: 500; font-variant-numeric: tabular-nums; }
#sel .sw { width: 8px; height: 8px; border-radius: 2px; flex: none; }
#sel .sw.ol { box-shadow: inset 0 0 0 1px var(--done); }
#sel .sw.zn { box-shadow: inset 0 0 0 1px var(--t2); }
#sel .tx { min-width: 0; flex: 1; display: grid; gap: 1px; }
#sel .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; color: var(--t1); }
#sel .nm span { color: var(--t2); font-weight: 400; margin-right: 6px; }
#sel .loc { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--t3); font: 11px/14px var(--mono); }
#sel .acts { display: flex; align-items: center; gap: 2px; flex: none; }
#sel button { height: 26px; padding: 0 9px; border: 0; border-radius: 6px; background: transparent; color: var(--t2); font: 500 12px var(--sans); cursor: default; }
#sel button:hover { background: rgba(255,255,255,.06); color: var(--t1); }

/* radial commands: flat pills that fan out inside the selection's zone */
#radial { position: absolute; left: 0; top: 0; width: 0; height: 0; z-index: 5; pointer-events: none; }
.it { pointer-events: auto; position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 6px; height: 22px; padding: 0 9px; border: 0; border-radius: 6px;
	background: #292a2f; color: var(--t1); font: 500 12px/1 var(--sans); white-space: nowrap; cursor: default; box-shadow: inset 0 0 0 .5px rgba(255,255,255,.12);
	transform: translate(calc(var(--x) * .2), calc(var(--y) * .2)) scale(.7); transform-origin: 0 50%; opacity: 0;
	transition: transform .3s cubic-bezier(.2,1.1,.3,1) calc(var(--i) * 40ms), opacity .14s calc(var(--i) * 40ms), background .1s; }
#radial.open .it { transform: translate(var(--x), var(--y)); opacity: 1; }
#radial.closing .it { transition-duration: .12s, .1s; transition-delay: 0s; }
.it:hover, .it:focus-visible { outline: none; background: #313238; box-shadow: inset 0 0 0 .5px rgba(255,255,255,.18); }
.it .dd { width: 6px; height: 6px; border-radius: 50%; background: var(--wait); flex: none; }
.it.off { color: var(--t3); }
.it.off .dd { background: var(--t3); }

/* prototype-only controls, outside the product */
#proto { position: fixed; left: 16px; bottom: 16px; z-index: 20; display: flex; align-items: center; gap: 2px; padding: 3px; border-radius: 9px;
	background: var(--pop); box-shadow: inset 0 0 0 .5px rgba(255,255,255,.12), 0 0 0 .5px rgba(0,0,0,.8), 0 8px 24px rgba(0,0,0,.35); font: 500 12px var(--sans); color: var(--t2); }
#proto span { padding: 0 8px 0 8px; font-weight: 400; color: var(--t3); }
#proto button { border: 0; background: transparent; color: inherit; height: 24px; padding: 0 10px; border-radius: 6px; font: inherit; cursor: default; display: flex; align-items: center; gap: 6px; }
#proto button:hover { color: var(--t1); }
#proto button.on { background: var(--raise2); color: var(--t1); }
#proto i.sep { width: .5px; height: 14px; background: var(--hair2); margin: 0 3px; }
#play::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--t3); }
#play.on::before { background: var(--acc); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>

<script>

{
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const COL = { cy: '#4c8df6', am: '#d99a3a', idle: '#4a4d55', gr: '#5f9e7f', fg: '#ececef', mu: '#8e9097', mu3: '#63656c', rd: '#e5646e', zone: '#1f2024', zoneOn: '#24252a', pop: '#161719' };
const SANS = '-apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, system-ui, sans-serif';
const MONO = '"SF Mono", ui-monospace, Menlo, "JetBrains Mono", monospace';
const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };

// ---- The factory: zones are queries over any source. Workflows are verbs that run on a zone or on one unit in it.
const KIND = { files: '▤', lines: '☰', branches: '⑂', prs: '⇄', tickets: '◈' };
// Layout is designed in pixels at the default fit, where one world unit is one tile pitch (12px tile + 7px gap).
const PX = 20, GUT = 10, COLW = 156, ROWH = 130, LANDH = 58, PAD = 12, TOP = 32, TILE = 12;
const box = (c, r, w = COLW, h = ROWH) => ({ x: (GUT + c * (COLW + GUT)) / PX, y: (GUT + r * (ROWH + GUT)) / PX, w: w / PX, h: h / PX });
const WORLD = { w: (GUT * 4 + COLW * 3) / PX, h: (GUT * 4 + ROWH * 2 + LANDH) / PX };
const Z = [
	{ id: 'intake', name: 'Intake', ...box(0, 0), person: true, src: ['files', 'docs/intake/*.md', 'not closed'] },
	{ id: 'roadmap', name: 'Roadmap', ...box(1, 0), src: ['lines', 'docs/roadmap.md', '- [ ] with no plan'] },
	{ id: 'draft', name: 'Draft plans', ...box(2, 0), person: true, src: ['files', 'docs/plans/*.md', 'status: draft'] },
	{ id: 'ready', name: 'Ready plans', ...box(2, 1), person: true, src: ['files', 'docs/plans/*.md', 'status: ready, no branch'] },
	{ id: 'building', name: 'Building', ...box(1, 1), src: ['branches', 'feat/* fix/*', 'no pull request yet'] },
	{ id: 'review', name: 'Pull requests', ...box(0, 1), person: true, src: ['prs', 'is:open', 'not merged'] },
	{ id: 'landed', name: 'Landed', ...box(0, 2, COLW * 3 + GUT * 2, LANDH), src: ['prs', 'is:merged', 'last 7 days'] },
];
const zi = id => Z.findIndex(z => z.id === id);
const ZB = id => Z[zi(id)];

// Commands. flow = a workflow starts a session; dec = a person decides, which changes the source; open = look at it.
const F = (w, sub, takes, x = {}) => ({ k: takes === 'new' ? 'new' : 'flow', w, lb: w, sub, takes, ic: takes === 'new' ? 'plus' : takes === 'all' ? 'stack' : 'run', ...x });

};

	intake: () => [F('file-work', 'log a new note', 'new'), F('prioritise-roadmap', 'triage the zone', 'all')],

	review: () => [F('review-branch', 'review every PR', 'all')],

// ---- Scenarios
const d = s => Date.parse(s);
const REPO = () => [
	...[
		['2026-11-08', 'restore-special-entries', "A failed update's restore removes a special entry inside a local-only directory"],
		['2026-11-15', 'git-fixtures-race', "Two Git test fixtures can race Git's detached auto maintenance"],

	{ z: 'roadmap', since: d('2026-11-15'), label: 'metastore-dogfood', title: 'Keep plans, intake and changelog in Metastore Cloud', ref: 'docs/roadmap.md · Milestone 5' },

	...['Document folders', 'Store model and local backend', 'Remote backend and login', 'Pull and status', 'Push and conflicts', 'Sync windows and ls', 'Scores', 'Scorers', 'Import, hooks and skill', 'Git backend']

	const [zl, zt] = toS(z.x, z.y), [zr, zb] = toS(z.x + z.w, z.y + z.h);
	const L0 = Math.max(zl + I, 6), R0 = Math.min(zr - I, VW - 6), T0 = Math.max(zt + I, 6), B0 = Math.min(zb - I, VH - 6);
	const tiles = S.pieces.filter(q => q.z === z.id && !q.hidden && q.cell).map(q => { const [cx, cy] = toS(q.cell[0], q.cell[1]); return { l: cx - ht, t: cy - ht, r: cx + ht, b: cy + ht, q }; });
	const sel = R.p && tiles.find(o => o.q === R.p);
	const tl = zl + PAD * k, top = zt + TOP * k;
	// rows: each chip goes in the first row with room, so short labels pair up
	const flow = (L, T, w, up) => { const rows = []; const pos = W.map(cw => { let r = rows.find(r => r.x + cw <= L + w); if (!r) { r = { x: L, i: rows.length }; rows.push(r); } const at = [r.x, r.i]; r.x += cw + G; return at; });
		const H = rows.length * CH + (rows.length - 1) * G, T1 = up ? T - H : T; return pos.map(([px, ri]) => [px, T1 + ri * (CH + G)]); };
	const col = (L, T, right) => W.map((cw, i) => [right ? L - cw : L, T + i * (CH + G)]);
	const cands = [];
	if (sel) { const H = n * CH + (n - 1) * G, T = Math.max(T0, Math.min(B0 - H, (sel.t + sel.b) / 2 - H / 2)); cands.push(col(sel.r + 10, T), col(sel.l - 10, T, true)); }
	const lastB = tiles.length ? Math.max(...tiles.map(o => o.b)) : top - 10;
	cands.push(flow(tl, lastB + 10, R0 - tl));
	if (tiles.length) { const row = tiles.filter(o => Math.abs(o.b - lastB) < 1), lr = Math.max(...row.map(o => o.r)); cands.push(flow(lr + 10, lastB - ht - CH / 2 + 0, R0 - lr - 10)); }
	cands.push(flow(tl, B0, R0 - tl, true));
	const near = o => sel && Math.abs(o.l - sel.l) < 2.5 * PX * k && Math.abs(o.t - sel.t) < 2.5 * PX * k;
	const score = pos => { let sc = 0;
		pos.forEach(([l, t], i) => { const r = l + W[i], b = t + CH;
			if (l < L0 - .5 || r > R0 + .5 || t < T0 - .5 || b > B0 + .5) sc += 1e6;
			for (const o of tiles) if (l < o.r + 2 && r > o.l - 2 && t < o.b + 2 && b > o.t - 2) sc += o === sel ? 1e5 : near(o) ? 50 : 1; });
		return sc; };
	let best = cands[0], bs = Infinity; for (const c of cands) { const sc = score(c); if (sc < bs) { bs = sc; best = c; } if (!sc) break; }
	// a full zone has no free space: the chips sit on a tray in the zone's own colour instead of on top of tiles
	R.tray = bs > 0 && bs < 1e5 ? { z, t: Math.min(...best.map(q => q[1])) - 8 } : null;
	[...rad.children].forEach((el, i) => {
		const l = Math.max(L0, Math.min(R0 - W[i], best[i][0])), t = Math.max(T0, Math.min(B0 - CH, best[i][1]));
		el.style.setProperty('--x', Math.round(l - x) + 'px'); el.style.setProperty('--y', Math.round(t - y) + 'px');
	});
}
function fire(i) {
	if (!R) return;
	const it = R.items[i]; if (!it || it.off) return;
	const p = R.p, z = R.z;
	if (it.focus) { flyTo(z); }
	else if (it.k === 'open') { log(`opened <b>${esc(p ? p.ref : z.src[1])}</b> ${it.sub}`); if (p) floatText(p.x, p.y, 'Opened', COL.fg); }
	else if (it.k === 'dec') {
		const from = p.z; it.fn(p); burst(p.x, p.y, COL.am, 18);
		log(`<span class="am">YOU</span> ${it.lb.toLowerCase()} <b>${esc(p.label)}</b>${p.z !== from && S.pieces.includes(p) ? ` → ${ZB(p.z).name.toUpperCase()}` : ''}`);
	}
	else if (it.takes === 'one') { p.session = { w: it.w, prog: 0 }; shock(p.x, p.y, COL.cy, 1.6); log(`<span class="cy">${it.w}</span> session started on <b>${esc(p.label)}</b>`); }
	else if (it.takes === 'new') { spawnNote('file-work'); }
	else { S.runs.push({ w: it.w, z: z.id, prog: 0 }); fx.push({ t: 'z', z, age: 0, life: 0.6 }); log(`<span class="cy">${it.w}</span> running on all of ${z.name.toUpperCase()}`); }
	closeRadial(); layout(); hud();
}

// ---- Input
const hit = (wx, wy) => {
	let best = null, bd = 0.5;
	for (const p of S.pieces) { if (p.hidden || p.over) continue; const dd = Math.max(Math.abs(p.x - wx), Math.abs(p.y - wy)); if (dd < bd) { bd = dd; best = p; } }
	if (best) return { p: best };
	const z = Z.find(z => wx >= z.x && wx <= z.x + z.w && wy >= z.y && wy <= z.y + z.h);
	return z ? { z } : {};
};
let drag = null;
cv.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y, moved: false }; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', e => {
	if (drag) {
		const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
		if (drag.moved || Math.hypot(dx, dy) > 4) { drag.moved = true; camT = null; cv.classList.add('pan'); cam.x = drag.cx - dx / cam.s; cam.y = drag.cy - dy / cam.s; tip.style.display = 'none'; return; }
	}
	const [wx, wy] = toW(...L(e)), h = hit(wx, wy);
	S.hover = h.p || null;
	cv.style.cursor = h.p || h.z ? 'pointer' : '';
	if (h.p && !R) showTip(h.p, ...L(e)); else tip.style.display = 'none';
});
cv.addEventListener('pointerleave', () => { S.hover = null; tip.style.display = 'none'; });
cv.addEventListener('pointerup', e => {
	const was = drag; drag = null; cv.classList.remove('pan');
	if (!was || was.moved) return;
	const [wx, wy] = toW(...L(e)), h = hit(wx, wy);
	tip.style.display = 'none';
	if (h.p) { S.sel = h.p; S.selZone = null; openRadial({ p: h.p }); }
	else if (h.z) { S.sel = null; S.selZone = h.z.id; openRadial({ z: h.z, wx, wy }); }
	else { S.sel = null; S.selZone = null; closeRadial(); hud(); }
});
cv.addEventListener('dblclick', e => { const [wx, wy] = toW(...L(e)), h = hit(wx, wy); if (h.z) flyTo(h.z); });
cv.addEventListener('wheel', e => {
	e.preventDefault(); camT = null;
	const [wx, wy] = toW(...L(e));
	cam.s = Math.max(10, Math.min(120, cam.s * Math.exp(-e.deltaY * 0.0015)));
	const [lx, ly] = L(e); cam.x = wx - (lx - VW / 2) / cam.s; cam.y = wy - (ly - VH / 2) / cam.s;
}, { passive: false });
addEventListener('keydown', e => {
	if (pop.classList.contains('hide')) return;
	if (/^[1-9]$/.test(e.key) && R) { fire(+e.key - 1); return; }
	const k = e.key.toLowerCase();
	if (k === 'escape') { S.sel = null; S.selZone = null; closeRadial(); hud(); }
	else if (k === ' ') { e.preventDefault(); togglePlay(); }
	else if (k === 'f') { fitView(); }
	else if (k === '+' || k === '=') camT = { ...cam, s: Math.min(120, cam.s * 1.4) };
	else if (k === '-') camT = { ...cam, s: Math.max(10, cam.s / 1.4) };
	else if (k.startsWith('arrow') || 'wasd'.includes(k) && k.length === 1) {
		const st = 60 / cam.s; camT = null;
		if (k === 'arrowleft' || k === 'a') cam.x -= st; if (k === 'arrowright' || k === 'd') cam.x += st;
		if (k === 'arrowup' || k === 'w') cam.y -= st; if (k === 'arrowdown' || k === 's') cam.y += st;
	}
});

const tip = $('tip');
function showTip(p, x, y) {
	tip.innerHTML = `<div>${esc(p.title)}</div><div class="m">${age(p)}d in ${ZB(p.z).name} · ${stateText(p)}</div>`;
	tip.style.display = 'block';
	const w = tip.offsetWidth, h = tip.offsetHeight;
	tip.style.left = Math.min(VW - w - 8, x + 14) + 'px'; tip.style.top = (y + 16 + h > VH ? y - h - 12 : y + 16) + 'px';
}

// ---- HUD
function togglePlay() { S.playing = !S.playing; log(S.playing ? 'simulation <span class="am">running</span>: agents pick up idle work, new notes arrive' : 'simulation paused'); hud(); }
$('play').onclick = togglePlay;
document.querySelectorAll('.sc').forEach(b => b.onclick = () => {
	document.querySelectorAll('.sc').forEach(x => x.classList.toggle('on', x === b));
	S.scen = b.dataset.v; S.playing = false; load(); fitView();
});

const ICON = {
	run: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 4.2v7.6L11.5 8z"/></svg>',
	stack: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="2.5" width="11" height="11" rx="2"/><path d="M5.5 6.5h5M5.5 9.5h5"/></svg>',
	plus: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3.5v9M3.5 8h9"/></svg>',
	merge: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="4.5" cy="3.5" r="1.5"/><circle cx="4.5" cy="12.5" r="1.5"/><circle cx="11.5" cy="9" r="1.5"/><path d="M4.5 5v6M4.5 5c0 3 2 4 5.5 4"/></svg>',
	x: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m4.5 4.5 7 7M11.5 4.5l-7 7"/></svg>',
	focus: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6V3.5a1 1 0 0 1 1-1H6M10 2.5h2.5a1 1 0 0 1 1 1V6M13.5 10v2.5a1 1 0 0 1-1 1H10M6 13.5H3.5a1 1 0 0 1-1-1V10"/></svg>',
	open: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h4v4M13 3 7.5 8.5M12 9.5V13H3V4h3.5"/></svg>',
	copy: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><rect x="5.5" y="5.5" width="8" height="8" rx="1.5"/><path d="M10.5 3.5v-.5A1.5 1.5 0 0 0 9 1.5H4A1.5 1.5 0 0 0 2.5 3v5A1.5 1.5 0 0 0 4 9.5h.5"/></svg>',
	check: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m3.5 8.5 3 3 6-7"/></svg>',
};
const urlOf = p => { const m = p.ref.match(/PR #(\d+)/); return m ? `https://github.com/Traction-Team/meta-harness/pull/${m[1]}` : p.ref.split(' · ')[0]; };
let selKey = '';
function hud() {
	const open = S.pieces.filter(p => p.z !== 'landed');
	const running = open.filter(p => p.session).length + S.runs.length;
	$('mbn').textContent = running;
	$('mbd').style.display = open.some(p => status(p) === 'waits') ? 'block' : 'none';
	const ses = open.filter(p => p.session).length, nr = S.runs.length;
	$('run').classList.toggle('on', running > 0); $('runn').textContent = `${ses} running` + (nr ? ` · ${nr} stage run${nr > 1 ? 's' : ''}` : '');
	$('play').textContent = S.playing ? 'Pause' : 'Play';
	$('play').classList.toggle('on', S.playing);
	// the footer: a legend with counts, or what you picked, where it lives, open or copy it
	const bar = $('sel'), p = S.sel && S.pieces.includes(S.sel) ? S.sel : null, z = !p && S.selZone ? ZB(S.selZone) : null;
	if (!p && !z) {
		const c = st => S.pieces.filter(x => status(x) === st).length;
		const n = { session: c('session'), waits: c('waits'), idle: c('idle'), landed: c('landed') };
		const key = 'lg' + JSON.stringify(n);
		if (key === selKey) return; selKey = key;
		const it = (st, lb, cls = '') => `<span><i class="sw ${cls}" style="background:${cls ? 'transparent' : colOf(st)}"></i><b>${n[st]}</b>${lb}</span>`;
		bar.innerHTML = `<div class="lg">${it('session', 'running')}${it('waits', 'waiting on you')}${it('idle', 'idle')}${it('landed', 'landed', 'ol')}</div>`;
		return;
	}
	const key = p ? `p${p.id}:${p.z}` : `z${z.id}:${S.pieces.filter(x => x.z === z.id).length}`;
	if (key === selKey) { if (p) bar.querySelector('.sw').style.background = colOf(status(p)); return; }
	selKey = key;
	const name = p ? `<span>${esc(p.label)}</span>${esc(p.title)}` : `${esc(z.name)}<span style="margin-left:6px">${S.pieces.filter(x => x.z === z.id).length}</span>`;
	const loc = p ? urlOf(p) : `${z.src[1]} · ${z.src[2]}`;
	const landed = p && status(p) === 'landed';
	bar.innerHTML = `<i class="sw ${p ? (landed ? 'ol' : '') : 'zn'}" style="background:${p && !landed ? colOf(status(p)) : 'transparent'}"></i>
		<div class="tx"><div class="nm">${name}</div><div class="loc">${esc(loc)}</div></div>
		<div class="acts"><button data-a="open">Open</button><button data-a="copy">Copy</button></div>`;
	bar.querySelector('[data-a=open]').onclick = () => { if (p) floatText(p.x, p.y, 'Opened', COL.fg); };
	bar.querySelector('[data-a=copy]').onclick = e => {
		navigator.clipboard?.writeText(loc).catch(() => {});
		const b = e.currentTarget; b.textContent = 'Copied';
		setTimeout(() => { if (b.isConnected) b.textContent = 'Copy'; }, 1200);
	};
}

// ---- Frame loop
let last = 0;
function frame(ts) {
	const t = ts / 1000, dt = Math.min(0.05, t - (last || t)); last = t;
	if (camT) {
		const k = Math.min(1, dt * 7);
		cam.x += (camT.x - cam.x) * k; cam.y += (camT.y - cam.y) * k; cam.s += (camT.s - cam.s) * k;
		if (Math.abs(camT.s - cam.s) < 0.05 && Math.hypot(camT.x - cam.x, camT.y - cam.y) < 0.01) camT = null;
	}
	for (const p of S.pieces) {
		let budget = dt * 10;
		while (p.path.length && budget > 0) {
			const [tx, ty] = p.path[0], dx = tx - p.x, dy = ty - p.y, dd = Math.hypot(dx, dy);
			if (dd <= budget) { p.x = tx; p.y = ty; p.path.shift(); budget -= dd; }
			else { p.x += dx / dd * budget; p.y += dy / dd * budget; budget = 0; }
			p.trail.unshift([p.x, p.y]); p.trail.length = Math.min(p.trail.length, 6);
		}
		if (!p.path.length) {
			if (p.trail.length) p.trail.pop();
			if (p.arrive) { p.arrive = false; shock(p.x, p.y, colOf(status(p)), 1); }
		}
	}
	for (const f of fx) { f.age += dt; if (f.t === 'p') { f.x += f.vx * dt; f.y += f.vy * dt; f.vx *= 0.92; f.vy *= 0.92; } }
	for (let i = fx.length - 1; i >= 0; i--) if (fx[i].age >= fx[i].life) fx.splice(i, 1);
	draw(t); placeRadial();
	requestAnimationFrame(frame);
}

// ---- The Mac: menu bar icon, popover under it, pin to float
const mbi = $('mbi'), arrow = $('arrow');
let pinned = false;
function placePop() {
	if (pinned) return;
	const r = mbi.getBoundingClientRect(), w = pop.offsetWidth, cx = r.left + r.width / 2;
	const left = Math.max(8, Math.min(innerWidth - w - 8, cx - w / 2));
	pop.style.left = Math.round(left) + 'px'; pop.style.top = '34px';
	pop.style.setProperty('--ax', (cx - left) + 'px');
	arrow.style.left = (cx - 9) + 'px';
}
function showPop(on) {
	pop.classList.toggle('hide', !on); mbi.classList.toggle('on', on);
	arrow.classList.toggle('hide', !on || pinned);
	if (!on) { S.sel = null; S.selZone = null; closeRadial(true); }
}
mbi.onclick = e => { e.stopPropagation(); showPop(pop.classList.contains('hide')); };
$('desk').addEventListener('pointerdown', e => { if (!pinned && !e.target.closest('#menubar')) showPop(false); });
$('pin').onclick = () => {
	pinned = !pinned; $('pin').classList.toggle('on', pinned); pop.classList.toggle('pinned', pinned);
	arrow.classList.toggle('hide', pinned || pop.classList.contains('hide'));
	if (pinned) { pop.style.top = (pop.offsetTop + 18) + 'px'; pop.style.left = (pop.offsetLeft - 24) + 'px'; } else placePop();
};
$('grip').addEventListener('pointerdown', e => {
	if (!pinned || e.target.closest('#pin')) return;
	const sx = e.clientX - pop.offsetLeft, sy = e.clientY - pop.offsetTop;
	const mv = ev => { pop.style.left = (ev.clientX - sx) + 'px'; pop.style.top = Math.max(28, ev.clientY - sy) + 'px'; };
	const up = () => { removeEventListener('pointermove', mv); removeEventListener('pointerup', up); };
	addEventListener('pointermove', mv); addEventListener('pointerup', up);
});
addEventListener('resize', placePop);
const clock = () => { $('clock').textContent = new Date().toLocaleString('en-AU', { weekday: 'short', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }).replace(',', ''); };
clock(); setInterval(clock, 15000);
// the editor behind the popover: wireframe code
{
	const cols = ['#c586c0', '#9cdcfe', '#dcdcaa', '#ce9178', '#6a9955', '#4fc1ff', '#d4d4d4'];
	let h = '';
	for (let i = 0; i < 34; i++) {
		const ind = [0, 1, 1, 2, 2, 3, 1, 0][i % 8] * 22; h += `<div class="ln"><span class="no">${i + 1}</span><span style="width:${ind}px"></span>`;
		const n = 1 + (i * 7) % 4; for (let k = 0; k < n; k++) h += `<i style="width:${24 + ((i * 13 + k * 29) % 90)}px;background:${cols[(i + k * 3) % cols.length]}"></i>`;
		h += '</div>';
	}
	document.querySelector('.code').innerHTML = h;
}
placePop(); resize(); fitView(true); load(); requestAnimationFrame(frame);
}
</script>
