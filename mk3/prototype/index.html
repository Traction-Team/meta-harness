<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Metafab Mark III</title>
<link rel="stylesheet" href="base.css?v=3000000010" />
<link rel="stylesheet" href="mk3.css?v=3000000010" />
</head>
<body>

<div class="win">

  <aside class="sidebar">
    <div class="side-chrome">
      <div class="lights"><i class="r"></i><i class="y"></i><i class="g"></i></div>
      <button class="ico" id="sideToggle" title="Hide sidebar"></button>
    </div>
    <div class="ws" id="wsWrap"></div>
    <div class="mode-wrap"><div class="seg mode" id="modeSeg"></div></div>
    <nav class="side-nav" id="sideNav"></nav>
    <div class="side-pool" id="sidePool"></div>
    <div class="side-fill"></div>
    <div class="side-tour" id="sideTour"></div>
  </aside>

  <section class="content">
    <header class="toolbar">
      <div class="tb-nav" id="tbNav"></div>
      <div class="crumb"><span class="crumb-app">Metafab</span><span class="crumb-sep">|</span><span id="crumb"></span></div>
      <div class="tb-acts" id="tbActs"></div>
    </header>

    <div class="canvas" id="canvas">
      <div class="col-main" id="main"></div>
      <aside class="panels" id="panels"></aside>
    </div>

    <footer class="strip">
      <span class="strip-item" id="stripLeft"></span>
      <span class="strip-item strip-right" id="stripRight"></span>
    </footer>
  </section>
</div>

<div class="toasts" id="toasts"></div>

<script src="data.js?v=3000000010"></script>
<script src="app.js?v=3000000010"></script>
</body>
</html>
